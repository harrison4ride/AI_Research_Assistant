[project]
name = "research-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Research Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "anthropic>=0.40",
    "openai>=1.50",
]

[tool.uv]
package = false
