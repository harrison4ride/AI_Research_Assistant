[project]
name = "research-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Research Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "anthropic>=1.12",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
# `uv run pytest` in backend/ runs the whole suite. tests/conftest.py isolates the
# tests from .env, the real database, the network, and any real LLM.
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
    # Emitted by PyMuPDF's SWIG bindings at import; not about this app.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
